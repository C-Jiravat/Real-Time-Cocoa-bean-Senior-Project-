<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ทดสอบการอัพโหลด</title>
    <style>
        body {
            background: #1a1a1a;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .log {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
            font-family: monospace;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #444;
        }
        .error { color: #ff6b6b; }
        .success { color: #51cf66; }
        .info { color: #74c0fc; }
        button {
            background: #9C27B0;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>🔧 Test Image Upload</h1>
    
    <input type="file" id="fileInput" accept="image/*">
    <button id="testBtn" onclick="testUpload()">Test Upload</button>
    <button onclick="clearLog()">Clear Log</button>
    
    <div class="log" id="log"></div>

    <script>
        let logBox = document.getElementById('log');
        
        function log(message, type = 'info') {
            console.log(message);
            let timestamp = new Date().toLocaleTimeString('th-TH');
            let className = type === 'error' ? 'error' : (type === 'success' ? 'success' : 'info');
            logBox.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }
        
        function clearLog() {
            logBox.innerHTML = '';
        }
        
        function testUpload() {
            let file = document.getElementById('fileInput').files[0];
            if (!file) {
                log('❌ โปรดเลือกไฟล์', 'error');
                return;
            }
            
            log(`📥 เลือกไฟล์: ${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`);
            log('🔍 เริ่มเรียกใช้ FileReader...');
            
            let reader = new FileReader();
            
            reader.onload = function(e) {
                log('✅ FileReader completed');
                log('🖼️ สร้าง Image element...');
                
                let img = new Image();
                
                img.onload = function() {
                    log(`✅ Image loaded: ${img.width}x${img.height}`);
                    log('📐 สร้าง Canvas...');
                    
                    let canvas = document.createElement('canvas');
                    let ctx = canvas.getContext('2d');
                    let scale = 1;
                    
                    if (img.width > 1280) {
                        scale = 1280 / img.width;
                        log(`📊 Scaling: ${scale.toFixed(2)}x`);
                    }
                    
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    log(`🎨 Canvas size: ${canvas.width}x${canvas.height}`);
                    
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    log('✅ Image drawn to canvas');
                    
                    log('🔄 เรียก canvas.toBlob()...');
                    canvas.toBlob(function(blob) {
                        if (!blob) {
                            log('❌ canvas.toBlob returned null!', 'error');
                            return;
                        }
                        
                        log(`✅ Blob created: ${(blob.size/1024/1024).toFixed(2)} MB`);
                        log(`📊 Compression: ${((1 - blob.size/file.size)*100).toFixed(1)}%`);
                        
                        log('📦 สร้าง FormData...');
                        let fd = new FormData();
                        fd.append('file', blob, file.name);
                        log('✅ FormData ready');
                        
                        log('📤 ส่ง fetch request ไป /upload_image...');
                        
                        fetch('/upload_image', {
                            method: 'POST',
                            body: fd
                        })
                        .then(response => {
                            log(`📡 Response status: ${response.status} ${response.statusText}`);
                            return response.json();
                        })
                        .then(data => {
                            log(`📋 Response: ${JSON.stringify(data)}`);
                            if (data.status === 'success') {
                                log(`✅ อัพโหลดสำเร็จ! (${data.size})`, 'success');
                            } else {
                                log(`❌ Server error: ${data.message}`, 'error');
                            }
                        })
                        .catch(error => {
                            log(`❌ Fetch error: ${error.message}`, 'error');
                            console.error(error);
                        });
                    }, 'image/jpeg', 0.75);
                };
                
                img.onerror = function() {
                    log('❌ Image failed to load', 'error');
                    console.error('Image error:', this);
                };
                
                log('🖼️ กำลังตั้ง image.src...');
                img.src = e.target.result;
            };
            
            reader.onerror = function() {
                log(`❌ FileReader error: ${reader.error}`, 'error');
            };
            
            reader.readAsDataURL(file);
        }
        
        // Test if browser supports canvas.toBlob
        window.addEventListener('DOMContentLoaded', function() {
            let canvas = document.createElement('canvas');
            if (!canvas.toBlob) {
                log('⚠️ Warning: canvas.toBlob not supported!', 'error');
            } else {
                log('✅ Browser supports canvas.toBlob', 'success');
            }
        });
    </script>
</body>
</html>
