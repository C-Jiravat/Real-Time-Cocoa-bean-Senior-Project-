[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cocoa-bean-ai-platform"
version = "0.1.0"
description = "Local-first cocoa bean analysis platform"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Cocoa Bean AI Platform Team" }]
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "python-multipart==0.0.20",
  "pydantic==2.10.3",
  "numpy==2.1.3",
  "Pillow==11.0.0",
  "opencv-python==4.10.0.84",
]

[project.optional-dependencies]
ml = [
  "torch==2.5.1",
  "torchvision==0.20.1",
  "timm==1.0.12",
  "ultralytics==8.3.43",
  "onnx==1.17.0",
  "onnxruntime==1.20.1",
]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.4",
  "ruff==0.8.2",
]

[tool.setuptools]
package-dir = { "" = "backend/src" }

[tool.setuptools.packages.find]
where = ["backend/src"]
include = ["cocoa_platform*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
